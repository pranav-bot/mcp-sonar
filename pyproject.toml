[project]
name = "mcp-benchmarker"
version = "0.1.0"
description = "Benchmark, compare, and interact with Model Context Protocol (MCP) servers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx>=0.28",
    "mcp>=1.28",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
mcp-bench = "mcp_benchmarker.cli:main"
mcp-interact = "mcp_benchmarker.interactor_cli:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mcp_benchmarker"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: hits real MCP servers (VPN, tokens required)",
]
