[project]
name = "mcp-sonar"
version = "0.1.0"
description = "mcp-sonar — benchmark, compare, and interact with MCP servers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx>=0.28",
    "mcp>=1.28",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
sonar = "mcp_sonar.cli:main"

[project.optional-dependencies]
mcp-lens = [
    "mcp-lens",
]
llm-anthropic = [
    "anthropic>=0.40",
]
llm-openai = [
    "openai>=1.0",
]
llm-vertex = [
    "google-genai>=1.0",
]
llm-anthropic-vertex = [
    "anthropic[vertex]>=0.40",
]
context-tokens = [
    "tiktoken>=0.7",
]
llm-all = [
    "mcp-lens",
    "anthropic>=0.40",
    "openai>=1.0",
    "google-genai>=1.0",
    "anthropic[vertex]>=0.40",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mcp_sonar"
module-root = "src"

[tool.uv.sources]
mcp-lens = { git = "https://github.com/devninja-in/mcp-lens.git" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: hits real MCP servers (VPN, tokens required)",
]
